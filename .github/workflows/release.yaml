name: Release Charts

on:
  push:
    branches:
      - main

jobs:
  release:
    # depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.10.3

      # A file:// dependency is packaged as its directory stands, and the
      # .tgz of its own dependencies are not committed (.gitignore): without
      # this, fusescope's clickhouse shipped without zookeeper, and a default
      # install could not migrate its schema. Two passes, so a chart's
      # dependencies are built before the charts that include it.
      - name: Build chart dependencies, nested ones first
        run: |
          for pass in 1 2; do
            for chart in charts/*/; do
              grep -q '^dependencies:' "$chart/Chart.yaml" || continue
              helm dependency build "$chart"
            done
          done

      - name: Check the fusescope chart packages zookeeper
        run: |
          helm package charts/fusescope -d /tmp/check >/dev/null
          tar tzf /tmp/check/fusescope-*.tgz | grep -q 'clickhouse/charts/zookeeper' || { echo "::error::clickhouse is packaged without zookeeper"; exit 1; }

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.5.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_SKIP_EXISTING: true
          CR_GENERATE_RELEASE_NOTES: true
