# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: clickhouse-instance_probes_test.yaml
templates:
  - templates/clickhouse-instance/clickhouse-instance.yaml
release:
  name: clickhouse
  namespace: signoz
tests:
  - it: should tolerate a minute of slow pings before restarting the server
    asserts:
      - equal:
          path: spec.templates.podTemplates[0].spec.containers[0].livenessProbe.timeoutSeconds
          value: 5
      - equal:
          path: spec.templates.podTemplates[0].spec.containers[0].livenessProbe.periodSeconds
          value: 10
      - equal:
          path: spec.templates.podTemplates[0].spec.containers[0].livenessProbe.failureThreshold
          value: 6
  - it: should give readiness pings the same timeout as liveness
    asserts:
      - equal:
          path: spec.templates.podTemplates[0].spec.containers[0].readinessProbe.timeoutSeconds
          value: 5
