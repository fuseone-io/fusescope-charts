{{- if and (include "clickhouse.coldStorage.useKeys" .) (not .Values.coldStorage.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clickhouse.coldStorage.secretName" . }}
  namespace: {{ include "clickhouse.namespace" . }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.coldStorage.secretKeys.accessKey }}: {{ .Values.coldStorage.accessKey | quote }}
  {{ .Values.coldStorage.secretKeys.secretAccess }}: {{ .Values.coldStorage.secretAccess | quote }}
{{- end }}
