{{- range $account := list "run" "cleanup" "investigate" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fsp.name" $ }}-{{ $account }}
  labels:
    {{- include "fsp.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $account }}
  {{- with (index $.Values.serviceAccounts $account).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
