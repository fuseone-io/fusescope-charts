{{- if include "fusescopeCollector.active" . }}
{{- $c := .Values.fusescopeCollector -}}
{{- $rumTLS := default "1.3" $c.rum.tlsMinVersion | toString -}}
{{- if not (has $rumTLS (list "1.2" "1.3")) -}}
{{- fail "fusescopeCollector.rum.tlsMinVersion must be \"1.2\" or \"1.3\"" -}}
{{- end -}}
{{- $ch := include "fusescopeCollector.clickhouse" . | fromJson -}}
{{- $proxies := include "fusescopeCollector.trustedProxies" . | fromJsonArray -}}
{{- $rum := include "fusescopeCollector.rumEnabled" . -}}
{{- $otlp := include "fusescopeCollector.otlpEnabled" . -}}
{{- $opamp := include "fusescopeCollector.opampEndpoint" . -}}
{{- if and $rum (not (hasPrefix "wss://" $opamp)) -}}
{{- fail "fusescopeCollector.opamp.endpoint must be wss:// with rum.enabled: the ingest token travels only over TLS" -}}
{{- end -}}
{{- $agents := include "fusescopeCollector.agentListenerEnabled" . -}}
{{- if $agents -}}
{{- $taken := list 13133 8888 -}}
{{- if $otlp }}{{ $taken = concat $taken (list (int $c.otlp.grpcPort) (int $c.otlp.httpPort)) }}{{ end -}}
{{- if $rum }}{{ $taken = append $taken (int $c.rum.port) }}{{ end -}}
{{- if has (int $c.agentListener.port) $taken -}}
{{- fail (printf "fusescopeCollector.agentListener.port %v is already used by the collector (%s)" $c.agentListener.port (join ", " $taken)) -}}
{{- end -}}
{{- end -}}
{{- $receivers := list -}}
{{- if $otlp }}{{ $receivers = append $receivers "otlp/insecure" }}{{ end -}}
{{- if $rum }}{{ $receivers = append $receivers "rum" }}{{ end -}}
{{- if $agents }}{{ $receivers = append $receivers "otlp/agents" }}{{ end -}}
{{- $metricReceivers := list -}}
{{- if $otlp }}{{ $metricReceivers = append $metricReceivers "otlp/insecure" }}{{ end -}}
{{- if $agents }}{{ $metricReceivers = append $metricReceivers "otlp/agents" }}{{ end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fusescopeCollector.fullname" . }}
  labels:
    {{- include "fusescopeCollector.labels" . | nindent 4 }}
data:
  # Read by the fusescopeopamp provider: the fusescope_opamp section never
  # reaches the collector. The ingest policy may change who is accepted, never
  # this configuration's listeners, pipelines or destinations.
  config.yaml: |
    fusescope_opamp:
      endpoint: {{ $opamp }}
      {{- if hasPrefix "ws://" $opamp }}
      # Plaintext to FuseScope's in-cluster OpAMP listener, allowed only by an
      # explicit tls.insecure (collector ADR 0008 §3, ADR 0004 as amended),
      # until FuseScope serves TLS to writer collectors (fuseone-io/fusescope#261).
      tls:
        insecure: true
      {{- else }}
      tls:
        min_version: "1.3"
        {{- if and $rum .Values.signoz.ingestPolicy.tls.caKey }}
        ca_file: /etc/fusescope-collector/opamp-ca/ca.crt
        {{- end }}
        {{- if $c.opamp.clientCertSecret }}
        cert_file: /etc/fusescope-collector/opamp-client/tls.crt
        key_file: /etc/fusescope-collector/opamp-client/tls.key
        {{- end }}
      {{- end }}
      storage: /var/lib/fusescope-collector/opamp
      {{- if $rum }}
      role: ingress
      auth:
        token_file: /etc/fusescope-collector/ingest-token/token
      {{- else }}
      role: writer
      {{- end }}

    receivers:
      {{- if $otlp }}
      # Plaintext and keyless, inside the cluster only, by the explicit
      # fusescopeCollector.otlp.insecure (collector ADR 0013). Its own id, so
      # otelcol_receiver_accepted_*{receiver="otlp/insecure"} counts what is left.
      otlp/insecure:
        protocols:
          grpc:
            endpoint: 0.0.0.0:{{ $c.otlp.grpcPort }}
          http:
            endpoint: 0.0.0.0:{{ $c.otlp.httpPort }}
      {{- end }}
      {{- if $rum }}
      rum:
        endpoint: 0.0.0.0:{{ $c.rum.port }}
        tls:
          min_version: {{ $rumTLS | quote }}
          cert_file: /etc/fusescope-collector/rum-tls/tls.crt
          key_file: /etc/fusescope-collector/rum-tls/tls.key
        ingest_policy: fusescope_opamp
        max_body_size: {{ int64 $c.rum.maxBodySize }}
        rate_limit:
          key: {rate: {{ $c.rum.rateLimit.key.rate }}, burst: {{ int64 $c.rum.rateLimit.key.burst }}}
          client: {rate: {{ $c.rum.rateLimit.client.rate }}, burst: {{ int64 $c.rum.rateLimit.client.burst }}}
        trusted_proxies: {{ toJson $proxies }}
        {{- with $c.rum.maxStaleness }}
        max_staleness: {{ . }}
        {{- end }}
      {{- end }}
      {{- if $agents }}
      # The FuseScope agents (fusescopeAgent): TLS 1.3, a client certificate
      # the client CA signed, and the agents' token, all required. Renewed
      # certificates and a new client CA bundle are reloaded from their files.
      otlp/agents:
        protocols:
          grpc:
            endpoint: 0.0.0.0:{{ $c.agentListener.port }}
            max_recv_msg_size_mib: 16
            tls:
              min_version: "1.3"
              cert_file: /etc/fusescope-collector/agents-tls/tls.crt
              key_file: /etc/fusescope-collector/agents-tls/tls.key
              client_ca_file: /etc/fusescope-collector/agents-ca/ca.crt
              client_ca_file_reload: true
              reload_interval: 1h
            auth:
              authenticator: bearertokenauth/agents
      {{- end }}
      {{- if $c.selfMetrics.enabled }}
      # The collector's own telemetry, from its loopback-only listener
      # (service.telemetry), written with the other metrics.
      prometheus/self:
        config:
          scrape_configs:
            - job_name: fusescope-collector
              scrape_interval: {{ $c.selfMetrics.scrapeInterval }}
              static_configs:
                - targets: [127.0.0.1:8888]
      {{- end }}

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      # FuseScope edits these two over OpAMP and never places them, so they
      # are declared and wired here.
      signozspanmapper: {groups: []}
      signozllmpricing:
        attrs:
          model: gen_ai.request.model
          in: gen_ai.usage.input_tokens
          out: gen_ai.usage.output_tokens
          cache_read: gen_ai.usage.cache_read.input_tokens
          cache_write: gen_ai.usage.cache_creation.input_tokens
        default_pricing:
          rules: []
        output_attrs:
          in: signoz.gen_ai.usage.input_tokens.cost
          out: signoz.gen_ai.usage.output_tokens.cost
          cache_read: signoz.gen_ai.usage.cache_read.input_tokens.cost
          cache_write: signoz.gen_ai.usage.cache_write.input_tokens.cost
          total: signoz.gen_ai.usage.tokens.cost
      {{- if $c.selfMetrics.enabled }}
      # host.name is the pod's name: it tells replicas apart.
      resourcedetection/system:
        detectors: [system]
        system:
          hostname_sources: [os]
      {{- end }}

    connectors:
      fusescope_spanmetrics:
      {{- if $c.meter.enabled }}
      fusescope_meter: {}
      {{- end }}

    exporters:
      fusescope_clickhouse:
        {{- include "fusescopeCollector.clickhouseConnection" $ch | nindent 8 }}
        traces: {database: {{ $ch.traces }}}
        logs: {database: {{ $ch.logs }}}
        metrics: {database: {{ $ch.metrics }}}
        {{- if $c.attributesMetadata.enabled }}
        attributes_metadata: {enabled: true}
        {{- end }}
        # The service map joins parent and child spans only within one insert.
        sending_queue:
          batch:
            flush_timeout: 10s
      {{- if $c.meter.enabled }}
      # Only the meter's hourly usage, to signoz_meter, with its own queue.
      fusescope_clickhouse/meter:
        mode: meter
        {{- include "fusescopeCollector.clickhouseConnection" $ch | nindent 8 }}
        meter: {database: {{ $ch.meter }}}
      {{- end }}

    extensions:
      fusescope_opamp: {}
      {{- if $agents }}
      # The token the agents present, from a Secret file; a new one is picked up.
      bearertokenauth/agents:
        scheme: Bearer
        filename: /etc/fusescope-collector/agent-token/token
      {{- end }}
      # Readiness only: the RUM receiver is a recoverable error while it holds
      # no valid ingest policy, which takes the pod out of the Service.
      # Without RUM, ready once the pipelines run.
      healthcheckv2:
        use_v2: true
        component_health:
          include_recoverable_errors: true
          recovery_duration: 0s
        http:
          endpoint: 0.0.0.0:13133
          status:
            enabled: true
            path: /health/status
          config:
            enabled: false

    service:
      extensions: [healthcheckv2, fusescope_opamp{{ if $agents }}, bearertokenauth/agents{{ end }}]
      # Only on loopback, never exposed by the Service.
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 127.0.0.1
                    port: 8888
      pipelines:
        traces:
          receivers: [{{ join ", " $receivers }}]
          processors: [memory_limiter, signozspanmapper, signozllmpricing]
          exporters: [fusescope_clickhouse, fusescope_spanmetrics{{ if $c.meter.enabled }}, fusescope_meter{{ end }}]
        logs:
          receivers: [{{ join ", " $receivers }}]
          processors: [memory_limiter]
          exporters: [fusescope_clickhouse{{ if $c.meter.enabled }}, fusescope_meter{{ end }}]
        {{- if $metricReceivers }}
        metrics:
          receivers: [{{ join ", " $metricReceivers }}]
          processors: [memory_limiter]
          exporters: [fusescope_clickhouse{{ if $c.meter.enabled }}, fusescope_meter{{ end }}]
        {{- end }}
        # Span metrics are derived from the traces: not metered.
        metrics/spanmetrics:
          receivers: [fusescope_spanmetrics]
          processors: [memory_limiter]
          exporters: [fusescope_clickhouse]
        {{- if $c.meter.enabled }}
        metrics/meter:
          receivers: [fusescope_meter]
          exporters: [fusescope_clickhouse/meter]
        {{- end }}
        {{- if $c.selfMetrics.enabled }}
        metrics/self:
          receivers: [prometheus/self]
          processors: [resourcedetection/system]
          exporters: [fusescope_clickhouse]
        {{- end }}
{{- end }}
