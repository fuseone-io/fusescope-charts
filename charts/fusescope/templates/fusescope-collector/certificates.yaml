{{- $clusterDomain := default "cluster.local" .Values.global.clusterDomain -}}
{{- $policy := .Values.signoz.ingestPolicy.tls.certManager -}}
{{- if and (include "signoz.ingestPolicyEnabled" .) $policy.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "signoz.ingestPolicyTLSSecret" . }}
  labels:
    {{- include "signoz.labels" . | nindent 4 }}
spec:
  secretName: {{ include "signoz.ingestPolicyTLSSecret" . }}
  dnsNames:
    {{- include "fusescope.serviceDNSNames" (dict "name" (include "signoz.fullname" .) "namespace" .Release.Namespace "clusterDomain" $clusterDomain) | fromJsonArray | toYaml | nindent 4 }}
  duration: {{ $policy.duration }}
  renewBefore: {{ $policy.renewBefore }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
  issuerRef:
    name: {{ required "signoz.ingestPolicy.tls.certManager.issuerRef.name is required" $policy.issuerRef.name }}
    kind: {{ $policy.issuerRef.kind }}
    group: {{ $policy.issuerRef.group }}
{{- end }}
{{- $rum := .Values.fusescopeCollector.rum.tls.certManager -}}
{{- if and (include "fusescopeCollector.rumEnabled" .) $rum.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "fusescopeCollector.rumTLSSecret" . }}
  labels:
    {{- include "fusescopeCollector.labels" . | nindent 4 }}
spec:
  secretName: {{ include "fusescopeCollector.rumTLSSecret" . }}
  dnsNames:
    {{- include "fusescope.serviceDNSNames" (dict "name" (include "fusescopeCollector.fullname" .) "namespace" .Release.Namespace "clusterDomain" $clusterDomain) | fromJsonArray | toYaml | nindent 4 }}
  duration: {{ $rum.duration }}
  renewBefore: {{ $rum.renewBefore }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
  issuerRef:
    name: {{ required "fusescopeCollector.rum.tls.certManager.issuerRef.name is required" $rum.issuerRef.name }}
    kind: {{ $rum.issuerRef.kind }}
    group: {{ $rum.issuerRef.group }}
{{- end }}
{{- $agentsTLS := .Values.fusescopeCollector.agentListener.tls.certManager -}}
{{- if and (include "fusescopeCollector.agentListenerEnabled" .) $agentsTLS.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "fusescopeCollector.agentListenerTLSSecret" . }}
  labels:
    {{- include "fusescopeCollector.labels" . | nindent 4 }}
spec:
  secretName: {{ include "fusescopeCollector.agentListenerTLSSecret" . }}
  dnsNames:
    {{- include "fusescope.serviceDNSNames" (dict "name" (include "fusescopeCollector.fullname" .) "namespace" .Release.Namespace "clusterDomain" $clusterDomain) | fromJsonArray | toYaml | nindent 4 }}
  duration: {{ $agentsTLS.duration }}
  renewBefore: {{ $agentsTLS.renewBefore }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
  issuerRef:
    name: {{ required "fusescopeCollector.agentListener.tls.certManager.issuerRef.name is required" $agentsTLS.issuerRef.name }}
    kind: {{ $agentsTLS.issuerRef.kind }}
    group: {{ $agentsTLS.issuerRef.group }}
{{- end }}
{{- $agentTLS := .Values.fusescopeAgent.tls.certManager -}}
{{- if and .Values.fusescopeAgent.enabled $agentTLS.enabled }}
---
# One client certificate for every agent of this release, not one per pod.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "fusescopeAgent.tlsSecret" . }}
  labels:
    {{- include "fusescopeAgent.labels" . | nindent 4 }}
spec:
  secretName: {{ include "fusescopeAgent.tlsSecret" . }}
  commonName: {{ required "fusescopeAgent.tls.certManager.commonName is required" $agentTLS.commonName }}
  duration: {{ $agentTLS.duration }}
  renewBefore: {{ $agentTLS.renewBefore }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - client auth
  issuerRef:
    name: {{ required "fusescopeAgent.tls.certManager.issuerRef.name is required" $agentTLS.issuerRef.name }}
    kind: {{ $agentTLS.issuerRef.kind }}
    group: {{ $agentTLS.issuerRef.group }}
{{- end }}
