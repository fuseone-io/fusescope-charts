{{- if include "fusescopeCollector.active" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fusescopeCollector.fullname" . }}
  labels:
    {{- include "fusescopeCollector.labels" . | nindent 4 }}
  {{- with .Values.fusescopeCollector.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.fusescopeCollector.service.type }}
  ports:
    {{- if include "fusescopeCollector.otlpEnabled" . }}
    - name: otlp
      port: {{ .Values.fusescopeCollector.otlp.grpcPort }}
      targetPort: otlp
      protocol: TCP
    - name: otlp-http
      port: {{ .Values.fusescopeCollector.otlp.httpPort }}
      targetPort: otlp-http
      protocol: TCP
    {{- end }}
    {{- if include "fusescopeCollector.rumEnabled" . }}
    - name: rum
      port: {{ .Values.fusescopeCollector.rum.port }}
      targetPort: rum
      protocol: TCP
    {{- end }}
    {{- if include "fusescopeCollector.agentListenerEnabled" . }}
    - name: otlp-agents
      port: {{ .Values.fusescopeCollector.agentListener.port }}
      targetPort: otlp-agents
      protocol: TCP
    {{- end }}
  selector:
    {{- include "fusescopeCollector.selectorLabels" . | nindent 4 }}
{{- end }}
