{{- if include "fusescopeCollector.active" . }}
{{- $c := .Values.fusescopeCollector -}}
{{- $ch := include "fusescopeCollector.clickhouse" . | fromJson -}}
{{- $policy := .Values.signoz.ingestPolicy -}}
{{- $rum := include "fusescopeCollector.rumEnabled" . -}}
{{- $otlp := include "fusescopeCollector.otlpEnabled" . -}}
{{- $opampCA := and $rum $policy.tls.caKey (hasPrefix "wss://" (include "fusescopeCollector.opampEndpoint" .)) -}}
{{- $agents := include "fusescopeCollector.agentListenerEnabled" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fusescopeCollector.fullname" . }}
  labels:
    {{- include "fusescopeCollector.labels" . | nindent 4 }}
spec:
  {{- if not $c.autoscaling.enabled }}
  replicas: {{ $c.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "fusescopeCollector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fusescopeCollector.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/fusescope-collector/configmap.yaml") . | sha256sum }}
        {{- with $c.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $c.imagePullSecrets }}
      imagePullSecrets:
      {{- range . }}
        - name: {{ . | quote }}
      {{- end }}
      {{- else }}
      {{- include "signoz.imagePullSecrets" . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "fusescopeCollector.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with $c.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with $c.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $c.podSecurityContext | nindent 8 }}
      {{- if include "fusescopeSchema.enabled" . }}
      # Wait, without writing, until the schema is migrated before writing.
      initContainers:
        {{- include "fusescopeSchema.checkContainer" . | nindent 8 }}
      {{- else if include "telemetryStoreMigrator.fork" . }}
      # On a fresh install the migrator is an ordinary Job running beside
      # this Deployment: wait until the schema is migrated before writing,
      # with the migrator's own image and settings.
      initContainers:
        - name: schema
          image: {{ include "otelCollector.image" . }}
          imagePullPolicy: {{ .Values.otelCollector.image.pullPolicy }}
          securityContext:
            {{- toYaml $c.securityContext | nindent 12 }}
          env:
            {{- include "snippet.telemetryStoreMigrator-env" . | nindent 12 }}
          args: ["migrate", "sync", "check"]
          {{- with .Values.telemetryStoreMigrator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      containers:
        - name: collector
          image: {{ include "fusescopeCollector.image" . }}
          imagePullPolicy: {{ $c.image.pullPolicy }}
          args:
            - --config=fusescopeopamp:/etc/fusescope-collector/config/config.yaml
          securityContext:
            {{- toYaml $c.securityContext | nindent 12 }}
          ports:
            {{- if $otlp }}
            - name: otlp
              containerPort: {{ $c.otlp.grpcPort }}
              protocol: TCP
            - name: otlp-http
              containerPort: {{ $c.otlp.httpPort }}
              protocol: TCP
            {{- end }}
            {{- if $rum }}
            - name: rum
              containerPort: {{ $c.rum.port }}
              protocol: TCP
            {{- end }}
            {{- if $agents }}
            - name: otlp-agents
              containerPort: {{ $c.agentListener.port }}
              protocol: TCP
            {{- end }}
            - name: health
              containerPort: 13133
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: health
            {{- toYaml $c.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health/status
              port: health
            {{- toYaml $c.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/fusescope-collector/config
              readOnly: true
            - name: storage
              mountPath: /var/lib/fusescope-collector
            {{- if $rum }}
            - name: ingest-token
              mountPath: /etc/fusescope-collector/ingest-token
              readOnly: true
            - name: rum-tls
              mountPath: /etc/fusescope-collector/rum-tls
              readOnly: true
            {{- end }}
            {{- if $opampCA }}
            - name: opamp-ca
              mountPath: /etc/fusescope-collector/opamp-ca
              readOnly: true
            {{- end }}
            {{- if $agents }}
            - name: agents-tls
              mountPath: /etc/fusescope-collector/agents-tls
              readOnly: true
            - name: agents-ca
              mountPath: /etc/fusescope-collector/agents-ca
              readOnly: true
            - name: agent-token
              mountPath: /etc/fusescope-collector/agent-token
              readOnly: true
            {{- end }}
            {{- if $c.opamp.clientCertSecret }}
            - name: opamp-client
              mountPath: /etc/fusescope-collector/opamp-client
              readOnly: true
            {{- end }}
            {{- if $ch.secret }}
            - name: clickhouse
              mountPath: /etc/fusescope-collector/clickhouse
              readOnly: true
            {{- end }}
      # Secrets as directories, not subPath, so a renewed certificate reaches the pod.
      volumes:
        - name: config
          configMap:
            name: {{ include "fusescopeCollector.fullname" . }}
        - name: storage
          emptyDir:
            sizeLimit: {{ $c.storage.sizeLimit }}
        {{- if $rum }}
        - name: ingest-token
          secret:
            secretName: {{ include "fusescopeCollector.tokenSecret" . }}
            defaultMode: 0440
            items:
              - key: {{ include "fusescopeCollector.tokenKey" . }}
                path: token
        - name: rum-tls
          secret:
            secretName: {{ include "fusescopeCollector.rumTLSSecret" . }}
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}
        {{- if $opampCA }}
        - name: opamp-ca
          secret:
            secretName: {{ include "signoz.ingestPolicyTLSSecret" . }}
            items:
              - key: {{ $policy.tls.caKey }}
                path: ca.crt
        {{- end }}
        {{- if $agents }}
        {{- $clientCA := include "fusescopeCollector.agentClientCA" . | fromJson }}
        - name: agents-tls
          secret:
            secretName: {{ include "fusescopeCollector.agentListenerTLSSecret" . }}
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        # Only the CA bundle: never the agents' private key.
        - name: agents-ca
          secret:
            secretName: {{ $clientCA.secret }}
            items:
              - key: {{ $clientCA.key }}
                path: ca.crt
        - name: agent-token
          secret:
            secretName: {{ include "fusescopeCollector.agentTokenSecret" . }}
            defaultMode: 0440
            items:
              - key: {{ include "fusescopeCollector.agentTokenKey" . }}
                path: token
        {{- end }}
        {{- with $c.opamp.clientCertSecret }}
        - name: opamp-client
          secret:
            secretName: {{ . }}
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}
        {{- if $ch.secret }}
        - name: clickhouse
          secret:
            secretName: {{ $ch.secret }}
            defaultMode: 0440
            items:
              - key: {{ $ch.key }}
                path: password
        {{- end }}
        {{- if include "fusescopeSchema.enabled" . }}
        {{- include "fusescopeSchema.volumes" . | nindent 8 }}
        {{- end }}
{{- end }}
