{{- if and .Values.fusescopeCollector.enabled .Values.fusescopeCollector.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fusescopeCollector.serviceAccountName" . }}
  labels:
    {{- include "fusescopeCollector.labels" . | nindent 4 }}
  {{- with .Values.fusescopeCollector.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
