{{- if and .Values.fusescopeCollector.enabled .Values.clickhouse.enabled .Values.clickhouse.password }}
# The in-chart ClickHouse password as a file: the collector reads outbound
# credentials only from files.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fusescopeCollector.fullname" . }}-clickhouse
  labels:
    {{- include "fusescopeCollector.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.clickhouse.password | toString | b64enc | quote }}
{{- end }}
