{{- if and .Values.mcpServer.enabled .Values.mcpServer.networkPolicy.enabled }}
{{- $np := .Values.mcpServer.networkPolicy -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcpServer.fullname" . }}
  labels:
    {{- include "mcpServer.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcpServer.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.mcpServer.service.port }}
          protocol: TCP
      {{- with $np.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "signoz.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ include "signoz.port" . }}
          protocol: TCP
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if include "mcpServer.docsRefreshEnabled" . }}
    - to:
        - ipBlock:
            {{- toYaml $np.docsEgress | nindent 12 }}
      ports:
        - port: 443
          protocol: TCP
    {{- end }}
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
