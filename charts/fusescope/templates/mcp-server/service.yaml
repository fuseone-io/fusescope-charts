{{- if .Values.mcpServer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcpServer.fullname" . }}
  labels:
    {{- include "mcpServer.labels" . | nindent 4 }}
  {{- with .Values.mcpServer.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.mcpServer.service.type }}
  ports:
    - name: http
      port: {{ .Values.mcpServer.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "mcpServer.selectorLabels" . | nindent 4 }}
{{- end }}
