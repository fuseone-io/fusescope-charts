{{- if and .Values.mcpServer.enabled .Values.mcpServer.ingress.enabled }}
{{- $ing := .Values.mcpServer.ingress -}}
{{- $fullName := include "mcpServer.fullname" . -}}
{{- $port := .Values.mcpServer.service.port -}}
{{- $className := default .Values.signoz.ingress.className $ing.className -}}
{{- $tls := $ing.tls -}}
{{- if and (not $tls) (not $ing.hosts) .Values.signoz.ingress.enabled -}}
{{- $tls = .Values.signoz.ingress.tls -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "mcpServer.labels" . | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $tls }}
  tls:
    {{- range . }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      {{- with .secretName }}
      secretName: {{ . }}
      {{- end }}
    {{- end }}
  {{- end }}
  rules:
    {{- range include "mcpServer.ingressHosts" . | fromJsonArray }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: {{ $ing.path }}
            pathType: {{ $ing.pathType }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $port }}
    {{- end }}
{{- end }}
