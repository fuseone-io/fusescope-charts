{{- if and .Values.mcpServer.enabled .Values.mcpServer.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mcpServer.serviceAccountName" . }}
  labels:
    {{- include "mcpServer.labels" . | nindent 4 }}
  {{- with .Values.mcpServer.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
