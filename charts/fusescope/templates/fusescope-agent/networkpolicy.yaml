{{- $o := .Values.fusescopeAgent.otlp -}}
{{- if and .Values.fusescopeAgent.enabled $o.enabled $o.networkPolicy.ingressFrom }}
# This policy admits only otlp.networkPolicy.ingressFrom on the OTLP ports; no rule without a source
# names them. Policies add up, so another one selecting the agents can admit more. Extra defence
# only (collector ADR 0014): a policy cannot express "same node".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fusescopeAgent.otlpServiceName" . }}
  labels:
    {{- include "fusescopeAgent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fusescopeAgent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml $o.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - port: otlp-grpc
          protocol: TCP
        - port: otlp-http
          protocol: TCP
    # The kubelet's probes.
    - ports:
        - port: health
          protocol: TCP
{{- end }}
