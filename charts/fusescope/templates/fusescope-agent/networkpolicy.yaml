{{- $o := .Values.fusescopeAgent.otlp -}}
{{- if and .Values.fusescopeAgent.enabled $o.enabled $o.networkPolicy.ingressFrom }}
# The OTLP ports accept only otlp.networkPolicy.ingressFrom; no rule without a source names them.
# Extra defence only (collector ADR 0014): a policy cannot express "same node".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fusescopeAgent.otlpServiceName" . }}
  labels:
    {{- include "fusescopeAgent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fusescopeAgent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml $o.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - port: otlp-grpc
          protocol: TCP
        - port: otlp-http
          protocol: TCP
    # The kubelet's probes.
    - ports:
        - port: health
          protocol: TCP
{{- end }}
