{{- if and (include "fusescopeSchema.enabled" .) .Values.clickhouse.enabled .Values.clickhouse.password }}
# The in-chart ClickHouse password as a file for fusescope-schema, which reads
# credentials only from files (collector ADR 0004).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "telemetryStoreMigrator.fullname" . }}-clickhouse
  labels:
    {{- include "telemetryStoreMigrator.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ .Values.clickhouse.password | toString | b64enc | quote }}
{{- end }}
