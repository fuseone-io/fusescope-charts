{{- if include "fusescopeSchema.enabled" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fusescopeSchema.jobName" . }}
  labels:
    {{- include "telemetryStoreMigrator.labels" . | nindent 4 }}
  {{- with .Values.telemetryStoreMigrator.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# An ordinary resource of the release, not a hook, named by a hash of its
# whole spec and telemetryStoreMigrator.runId. An upgrade that changes neither
# leaves it alone, finished or still running; one that changes the spec
# creates a new Job after its ConfigMap and Secret, so its immutable spec is
# never edited. A new runId runs it again, as after a failure once the cause
# is fixed. The collectors wait for it with check --wait.
spec:
  {{- include "fusescopeSchema.jobSpec" . | nindent 2 }}
{{- end }}
