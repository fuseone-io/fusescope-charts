{{- if include "telemetryStoreMigrator.fork" . }}
# The earlier collector's migrator (telemetryStoreMigrator.migrator: fork).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "telemetryStoreMigrator.fullname" . }}
  labels:
    {{- include "telemetryStoreMigrator.selectorLabels" . | nindent 4 }}
  annotations:
    {{- with .Values.telemetryStoreMigrator.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.telemetryStoreMigrator.upgradeHelmHooks }}
    argocd.argoproj.io/sync-options: Force=true,Replace=true
    {{- if .Release.IsUpgrade }}
    helm.sh/hook: pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    {{- end }}
    {{- end }}
spec:
  template:
    metadata:
      labels:
        {{- include "telemetryStoreMigrator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.telemetryStoreMigrator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.telemetryStoreMigrator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.telemetryStoreMigrator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.telemetryStoreMigrator.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "telemetryStoreMigrator.serviceAccountName" . }}
      initContainers:
        - name: ready
          image: {{ include "otelCollector.image" . }}
          imagePullPolicy: {{ .Values.otelCollector.image.pullPolicy }}
          env:
            {{- include "snippet.telemetryStoreMigrator-env" . | nindent 12 }}
          args:
            - "migrate"
            - "ready"
          {{- with .Values.telemetryStoreMigrator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: bootstrap
          image: {{ include "otelCollector.image" . }}
          imagePullPolicy: {{ .Values.otelCollector.image.pullPolicy }}
          env:
            {{- include "snippet.telemetryStoreMigrator-env" . | nindent 12 }}
          args:
            - "migrate"
            - "bootstrap"
          {{- with .Values.telemetryStoreMigrator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: sync
          image: {{ include "otelCollector.image" . }}
          imagePullPolicy: {{ .Values.otelCollector.image.pullPolicy }}
          env:
            {{- include "snippet.telemetryStoreMigrator-env" . | nindent 12 }}
          args:
            - "migrate"
            - "sync"
            - "up"
          {{- with .Values.telemetryStoreMigrator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      containers:
        - name: async
          image: {{ include "otelCollector.image" . }}
          imagePullPolicy: {{ .Values.otelCollector.image.pullPolicy }}
          env:
            {{- include "snippet.telemetryStoreMigrator-env" . | nindent 12 }}
          args:
            - "migrate"
            - "async"
            - "up"
          {{- with .Values.telemetryStoreMigrator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      restartPolicy: OnFailure
{{- else if include "fusescopeSchema.enabled" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fusescopeSchema.jobName" . }}
  labels:
    {{- include "telemetryStoreMigrator.labels" . | nindent 4 }}
  {{- with .Values.telemetryStoreMigrator.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# An ordinary resource of the release, not a hook, named by a hash of its
# whole spec and telemetryStoreMigrator.runId. An upgrade that changes neither
# leaves it alone, finished or still running; one that changes the spec
# creates a new Job after its ConfigMap and Secret, so its immutable spec is
# never edited. A new runId runs it again, as after a failure once the cause
# is fixed. The collectors wait for it with check --wait.
spec:
  {{- include "fusescopeSchema.jobSpec" . | nindent 2 }}
{{- end }}
