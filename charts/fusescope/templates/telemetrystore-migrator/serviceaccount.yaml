{{- if and .Values.telemetryStoreMigrator.serviceAccount.create (include "telemetryStoreMigrator.fork" .) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "telemetryStoreMigrator.serviceAccountName" . }}
  labels:
    {{- include "telemetryStoreMigrator.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.telemetryStoreMigrator.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.telemetryStoreMigrator.upgradeHelmHooks }}
    argocd.argoproj.io/sync-options: Force=true,Replace=true
    {{- if .Release.IsUpgrade }}
    helm.sh/hook: pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    {{- end }}
    {{- end }}
{{- include "signoz.imagePullSecrets" . }}
{{- else if and .Values.telemetryStoreMigrator.serviceAccount.create (include "fusescopeSchema.enabled" .) -}}
# fusescope-schema's own account, an ordinary resource of the release like
# its Job. The earlier one became a pre-upgrade hook on every upgrade, which
# Helm then removed as gone from the release, leaving a Job that cannot
# create its pods; a cluster upgraded before still holds it as a hook.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fusescopeSchema.serviceAccountName" . }}
  labels:
    {{- include "telemetryStoreMigrator.labels" . | nindent 4 }}
  {{- with .Values.telemetryStoreMigrator.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- include "signoz.imagePullSecrets" . }}
{{- end -}}
