apiVersion: v2
name: fusescope
version: 0.154.0
appVersion: "0.154.0"
description: FuseScope observability platform (APM, traces, metrics and logs) Helm chart
type: application
home: https://github.com/fuseone-io/fusescope
icon: https://raw.githubusercontent.com/fuseone-io/fusescope/main/docs/brand/fusescope-app-icon.svg
keywords:
  - FuseScope
  - opentelemetry
  - apm
  - monitoring
  - distributed tracing
  - distributed logging
sources:
  - https://github.com/fuseone-io/fusescope-charts
  - https://github.com/fuseone-io/fusescope
  - https://github.com/fuseone-io/fusescope-otel-collector
dependencies:
  - name: clickhouse
    repository: file://../clickhouse
    condition: clickhouse.enabled
    version: 24.1.19
  - name: postgresql
    repository: file://../postgresql
    condition: postgresql.enabled
    version: 0.0.3
maintainers:
  - name: FuseOne
    url: https://github.com/fuseone-io
