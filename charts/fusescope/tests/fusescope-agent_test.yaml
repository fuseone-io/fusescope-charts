suite: Test the FuseScope agents and the collector's agents' listener

templates:
  - templates/fusescope-collector/configmap.yaml
  - templates/fusescope-collector/deployment.yaml
  - templates/fusescope-collector/service.yaml
  - templates/fusescope-collector/certificates.yaml
  - templates/fusescope-collector/networkpolicy.yaml
  - templates/fusescope-agent/configmap.yaml
  - templates/fusescope-agent/daemonset.yaml
  - templates/fusescope-agent/rbac.yaml

release:
  name: fusescope
  namespace: platform

capabilities:
  majorVersion: 1
  minorVersion: 30
  apiVersions:
    - networking.k8s.io/v1
    - cert-manager.io/v1

# The listener with its certificate and token, and the agents' certificate;
# the agents themselves are enabled per test.
values:
  - ./values/fusescope-agent.yaml

tests:
  - it: should run no agents and no agents' listener by default
    set:
      fusescopeCollector.agentListener.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/fusescope-agent/daemonset.yaml
      - hasDocuments:
          count: 0
        template: templates/fusescope-agent/rbac.yaml
      - hasDocuments:
          count: 0
        template: templates/fusescope-collector/networkpolicy.yaml
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: otlp/agents|bearertokenauth
        template: templates/fusescope-collector/configmap.yaml
      - notContains:
          path: spec.ports
          content:
            name: otlp-agents
          any: true
        template: templates/fusescope-collector/service.yaml

  # The listener.

  - it: should serve the agents' listener on 4322 with TLS 1.3, the client CA and the token, in every pipeline
    template: templates/fusescope-collector/configmap.yaml
    set:
      fusescopeCollector.otlp.insecure: true
      fusescopeCollector.otlp.networkPolicy.ingressFrom:
        - podSelector:
            matchLabels: {app: sdk}
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: |-
            otlp/agents:
                protocols:
                  grpc:
                    endpoint: 0.0.0.0:4322
                    max_recv_msg_size_mib: 16
                    tls:
                      min_version: "1.3"
                      cert_file: /etc/fusescope-collector/agents-tls/tls.crt
                      key_file: /etc/fusescope-collector/agents-tls/tls.key
                      client_ca_file: /etc/fusescope-collector/agents-ca/ca.crt
                      client_ca_file_reload: true
                      reload_interval: 1h
                    auth:
                      authenticator: bearertokenauth/agents
      - matchRegex:
          path: data["config.yaml"]
          pattern: |-
            bearertokenauth/agents:
                scheme: Bearer
                filename: /etc/fusescope-collector/agent-token/token
      - matchRegex:
          path: data["config.yaml"]
          pattern: "extensions: \\[healthcheckv2, fusescope_opamp, bearertokenauth/agents\\]"
      - matchRegex:
          path: data["config.yaml"]
          pattern: |-
            traces:
                  receivers: \[otlp/insecure, otlp/agents\]
      - matchRegex:
          path: data["config.yaml"]
          pattern: |-
            logs:
                  receivers: \[otlp/insecure, otlp/agents\]
      - matchRegex:
          path: data["config.yaml"]
          pattern: |-
            metrics:
                  receivers: \[otlp/insecure, otlp/agents\]
      # The SDKs' plaintext receiver, with the opt-in (collector ADR 0013), stays without TLS.
      - matchRegex:
          path: data["config.yaml"]
          pattern: |-
            otlp/insecure:
                protocols:
                  grpc:
                    endpoint: 0.0.0.0:4317
                  http:
                    endpoint: 0.0.0.0:4318

  - it: should give the agents' metrics a pipeline when the SDKs' OTLP is off
    template: templates/fusescope-collector/configmap.yaml
    set:
      fusescopeCollector.otlp.insecure: false
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: |-
            metrics:
                  receivers: \[otlp/agents\]
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "0.0.0.0:4317"

  - it: should mount the listener's certificate, only the CA bundle of the agents' Secret, and the token
    template: templates/fusescope-collector/deployment.yaml
    set:
      fusescopeCollector.agentListener.token.secretKey: value
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: otlp-agents
            containerPort: 4322
            protocol: TCP
      - contains:
          path: spec.template.spec.volumes
          content:
            name: agents-tls
            secret:
              secretName: agents-tls
              defaultMode: 0440
              items:
                - key: tls.crt
                  path: tls.crt
                - key: tls.key
                  path: tls.key
      - contains:
          path: spec.template.spec.volumes
          content:
            name: agents-ca
            secret:
              secretName: agent-client
              items:
                - key: ca.crt
                  path: ca.crt
      - contains:
          path: spec.template.spec.volumes
          content:
            name: agent-token
            secret:
              secretName: agent-token
              defaultMode: 0440
              items:
                - key: value
                  path: token
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: agents-ca
            mountPath: /etc/fusescope-collector/agents-ca
            readOnly: true

  - it: should verify agents with the client CA Secret when set
    template: templates/fusescope-collector/deployment.yaml
    set:
      fusescopeCollector.agentListener.clientCA.existingSecret: ca-bundle
      fusescopeCollector.agentListener.clientCA.key: bundle.pem
      fusescopeAgent.tls.existingSecret: ""
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: agents-ca
            secret:
              secretName: ca-bundle
              items:
                - key: bundle.pem
                  path: ca.crt

  - it: should expose the agents' port on the collector Service
    template: templates/fusescope-collector/service.yaml
    set:
      fusescopeCollector.agentListener.port: 4400
    asserts:
      - contains:
          path: spec.ports
          content:
            name: otlp-agents
            port: 4400
            targetPort: otlp-agents
            protocol: TCP

  # With the plaintext receiver too, 4317/4318 admit only otlp.networkPolicy.ingressFrom
  # (fusescope-collector-networkpolicy_test.yaml).
  - it: should let only this release's agents reach the agents' port, and anyone the other ports
    template: templates/fusescope-collector/networkpolicy.yaml
    asserts:
      - isKind:
          of: NetworkPolicy
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: fusescope
            app.kubernetes.io/instance: fusescope
            app.kubernetes.io/component: fusescope-collector
      - equal:
          path: spec.ingress
          value:
            - from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/name: fusescope
                      app.kubernetes.io/instance: fusescope
                      app.kubernetes.io/component: fusescope-agent
              ports:
                - port: otlp-agents
                  protocol: TCP
            - ports:
                - port: health
                  protocol: TCP

  - it: should keep RUM open to anyone under the NetworkPolicy
    template: templates/fusescope-collector/networkpolicy.yaml
    values:
      - ./values/fusescope-agent.yaml
      - ./values/fusescope-collector.yaml
    asserts:
      - contains:
          path: spec.ingress[1].ports
          content:
            port: rum
            protocol: TCP

  - it: should render no NetworkPolicy when it is off
    template: templates/fusescope-collector/networkpolicy.yaml
    set:
      fusescopeCollector.agentListener.networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should issue the listener's certificate for the collector Service names with cert-manager
    template: templates/fusescope-collector/certificates.yaml
    set:
      fusescopeCollector.agentListener.tls.existingSecret: ""
      fusescopeCollector.agentListener.tls.certManager.enabled: true
      fusescopeCollector.agentListener.tls.certManager.issuerRef.name: internal-ca
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: fusescope-collector-agents-tls
      - equal:
          path: spec.usages
          value: [server auth]
      - contains:
          path: spec.dnsNames
          content: fusescope-collector.platform.svc
      - equal:
          path: spec.privateKey
          value:
            algorithm: ECDSA
            size: 256
            rotationPolicy: Always

  - it: should refuse the listener without its certificate
    template: templates/fusescope-collector/deployment.yaml
    set:
      fusescopeCollector.agentListener.tls.existingSecret: ""
    asserts:
      - failedTemplate:
          errorMessage: "fusescopeCollector.agentListener.tls.existingSecret or fusescopeCollector.agentListener.tls.certManager.enabled is required: the agents' listener is TLS only"

  - it: should refuse the listener without a token Secret
    template: templates/fusescope-collector/deployment.yaml
    set:
      fusescopeCollector.agentListener.token.existingSecret: ""
    asserts:
      - failedTemplate:
          errorMessage: "fusescopeCollector.agentListener.token.existingSecret is required: the agents' listener requires a token, read from a Secret"

  - it: should refuse the listener without a CA to verify agents with
    template: templates/fusescope-collector/deployment.yaml
    set:
      fusescopeAgent.tls.existingSecret: ""
    asserts:
      - failedTemplate:
          errorMessage: "fusescopeCollector.agentListener.clientCA.existingSecret, or fusescopeAgent.tls, is required: the CA bundle agent certificates must chain to"

  # The Deployment renders the ConfigMap for its checksum, so it fails first.
  - it: should refuse an agents' port the SDKs' OTLP uses
    template: templates/fusescope-collector/deployment.yaml
    set:
      fusescopeCollector.otlp.insecure: true
      fusescopeCollector.agentListener.port: 4317
      fusescopeCollector.otlp.networkPolicy.ingressFrom:
        - podSelector:
            matchLabels: {app: sdk}
    asserts:
      - failedTemplate:
          errorMessage: "fusescopeCollector.agentListener.port 4317 is already used by the collector (13133, 8888, 4317, 4318)"

  - it: should refuse an agents' port RUM uses
    template: templates/fusescope-collector/deployment.yaml
    values:
      - ./values/fusescope-agent.yaml
      - ./values/fusescope-collector.yaml
      - ./values/otlp-insecure.yaml
    set:
      fusescopeCollector.agentListener.port: 4319
      fusescopeCollector.otlp.networkPolicy.ingressFrom:
        - podSelector:
            matchLabels: {app: sdk}
    asserts:
      - failedTemplate:
          errorMessage: "fusescopeCollector.agentListener.port 4319 is already used by the collector (13133, 8888, 4317, 4318, 4319)"

  # The agents.

  - it: should run the agents as a DaemonSet with the collector's image and the agent configuration
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeAgent.enabled: true
    asserts:
      - isKind:
          of: DaemonSet
      - equal:
          path: metadata.name
          value: fusescope-agent
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/fuseone-io/fusescope-collector:0.6.2@sha256:35b0ae88a6d7bb7735e82e63ee6f91d1e8fed158f24e23c13639577426c98909
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --config=/etc/fusescope-agent/config/config.yaml
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls
            secret:
              secretName: agent-client
              defaultMode: 0440
              items:
                - key: tls.crt
                  path: tls.crt
                - key: tls.key
                  path: tls.key
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gateway-ca
            secret:
              secretName: agents-tls
              items:
                - key: ca.crt
                  path: ca.crt
      - contains:
          path: spec.template.spec.volumes
          content:
            name: token
            secret:
              secretName: agent-token
              defaultMode: 0440
              items:
                - key: token
                  path: token
      - contains:
          path: spec.template.spec.volumes
          content:
            name: pod-logs
            hostPath:
              path: /var/log/pods
              type: Directory
      - contains:
          path: spec.template.spec.volumes
          content:
            name: state
            hostPath:
              path: /var/lib/fusescope-agent
              type: DirectoryOrCreate
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: hostfs
            mountPath: /hostfs
            readOnly: true
            mountPropagation: HostToContainer

  - it: should take an image of its own without inheriting the collector's digest
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeAgent.enabled: true
      fusescopeAgent.image.tag: 0.4.1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/fuseone-io/fusescope-collector:0.4.1

  - it: should send to the listener over TLS 1.3 with the client certificate and the token
    template: templates/fusescope-agent/configmap.yaml
    set:
      fusescopeAgent.enabled: true
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: |-
            otlp_grpc/gateway:
                endpoint: fusescope-collector.platform.svc:4322
                compression: zstd
                tls:
                  min_version: "1.3"
                  ca_file: /etc/fusescope-agent/gateway-ca/ca.crt
                  cert_file: /etc/fusescope-agent/tls/tls.crt
                  key_file: /etc/fusescope-agent/tls/tls.key
      - matchRegex:
          path: data["config.yaml"]
          pattern: "filename: /etc/fusescope-agent/token/token"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "exclude: \\[/var/log/pods/platform_fusescope-agent-\\*/agent/\\*.log\\]"
      - matchRegex:
          path: data["config.yaml"]
          pattern: "receivers: \\[host_metrics, kubelet_stats\\]"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: insecure_skip_verify

  - it: should collect only what is enabled
    template: templates/fusescope-agent/configmap.yaml
    set:
      fusescopeAgent.enabled: true
      fusescopeAgent.podLogs.enabled: false
      fusescopeAgent.kubeletStats.enabled: false
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "receivers: \\[host_metrics\\]"
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: file_log|file_storage|kubelet_stats

  - it: should send to a gateway outside the release, verified with its own CA bundle
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeCollector.agentListener.enabled: false
      fusescopeAgent.enabled: true
      fusescopeAgent.gateway.endpoint: gateway.example.internal:4322
      fusescopeAgent.gateway.ca.existingSecret: gateway-ca
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gateway-ca
            secret:
              secretName: gateway-ca
              items:
                - key: ca.crt
                  path: ca.crt

  - it: should refuse a gateway outside the release without its CA bundle
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeCollector.agentListener.enabled: false
      fusescopeAgent.enabled: true
      fusescopeAgent.gateway.endpoint: gateway.example.internal:4322
    asserts:
      - failedTemplate:
          errorMessage: "fusescopeAgent.gateway.ca.existingSecret is required for a gateway outside this release: the CA bundle the agents verify it with"

  - it: should refuse agents with nowhere to send
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeCollector.agentListener.enabled: false
      fusescopeAgent.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "fusescopeAgent.enabled needs fusescopeCollector.agentListener.enabled, or fusescopeAgent.gateway.endpoint for a gateway outside this release"

  - it: should refuse agents with nothing to collect
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeAgent.enabled: true
      fusescopeAgent.podLogs.enabled: false
      fusescopeAgent.hostMetrics.enabled: false
      fusescopeAgent.kubeletStats.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "fusescopeAgent.enabled with nothing to collect: enable podLogs, hostMetrics or kubeletStats"

  - it: should refuse agents without a client certificate
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeCollector.agentListener.clientCA.existingSecret: ca-bundle
      fusescopeAgent.enabled: true
      fusescopeAgent.tls.existingSecret: ""
    asserts:
      - failedTemplate:
          errorMessage: "fusescopeAgent.tls.existingSecret or fusescopeAgent.tls.certManager.enabled is required: the agents present a client certificate"

  - it: should issue one client certificate for every agent with cert-manager
    template: templates/fusescope-collector/certificates.yaml
    set:
      fusescopeAgent.enabled: true
      fusescopeAgent.tls.existingSecret: ""
      fusescopeAgent.tls.certManager.enabled: true
      fusescopeAgent.tls.certManager.issuerRef.name: internal-ca
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: fusescope-agent-tls
      - equal:
          path: spec.commonName
          value: fusescope-agent
      - equal:
          path: spec.usages
          value: [client auth]
      - notExists:
          path: spec.dnsNames

  - it: should refuse the agents' cert-manager certificate without an issuer
    template: templates/fusescope-collector/certificates.yaml
    set:
      fusescopeAgent.enabled: true
      fusescopeAgent.tls.existingSecret: ""
      fusescopeAgent.tls.certManager.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: "fusescopeAgent.tls.certManager.issuerRef.name is required"

  - it: should give the agents read-only access to pods, nodes and the kubelet's stats
    template: templates/fusescope-agent/rbac.yaml
    set:
      fusescopeAgent.enabled: true
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [pods, namespaces, nodes]
              verbs: [get, list, watch]
            - apiGroups: [apps]
              resources: [replicasets]
              verbs: [get, list, watch]
            - apiGroups: [""]
              resources: [nodes/stats]
              verbs: [get]

  - it: should drop the kubelet stats rule without kubelet stats, and bind the role to the agents' account only
    template: templates/fusescope-agent/rbac.yaml
    set:
      fusescopeAgent.enabled: true
      fusescopeAgent.kubeletStats.enabled: false
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [pods, namespaces, nodes]
              verbs: [get, list, watch]
            - apiGroups: [apps]
              resources: [replicasets]
              verbs: [get, list, watch]
        documentSelector:
          path: kind
          value: ClusterRole
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: fusescope-agent
              namespace: platform
        documentSelector:
          path: kind
          value: ClusterRoleBinding

  # The root exception (collector-server ADR 0011): uid 0 only to
  # read pod logs and host metrics, with everything else locked down.

  - it: should run as uid 0, locked down, only to read pod logs and host metrics
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeAgent.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            seccompProfile:
              type: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

  - it: should run as uid 0 for host metrics alone
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeAgent.enabled: true
      fusescopeAgent.podLogs.enabled: false
      fusescopeAgent.kubeletStats.enabled: false
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 0

  - it: should run as non-root when it reads neither pod logs nor host metrics
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeAgent.enabled: true
      fusescopeAgent.podLogs.enabled: false
      fusescopeAgent.hostMetrics.enabled: false
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault

  - it: should run as the user the values set, where nodes allow non-root
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeAgent.enabled: true
      fusescopeAgent.podSecurityContext.runAsUser: 10001
      fusescopeAgent.podSecurityContext.runAsGroup: 10001
      fusescopeAgent.podSecurityContext.runAsNonRoot: true
      fusescopeAgent.podSecurityContext.fsGroup: 10001
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault

  - it: should refuse a privileged agent
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeAgent.enabled: true
      fusescopeAgent.securityContext.privileged: true
    asserts:
      - failedTemplate:
          errorMessage: "fusescopeAgent.securityContext must keep privileged and allowPrivilegeEscalation false, readOnlyRootFilesystem true, and drop ALL capabilities (collector-server ADR 0011)"

  - it: should refuse an agent that adds a capability
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeAgent.enabled: true
      fusescopeAgent.securityContext.capabilities.add: [DAC_READ_SEARCH]
    asserts:
      - failedTemplate:
          errorMessage: "fusescopeAgent.securityContext must keep privileged and allowPrivilegeEscalation false, readOnlyRootFilesystem true, and drop ALL capabilities (collector-server ADR 0011)"

  - it: should refuse an agent with a writable root filesystem
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeAgent.enabled: true
      fusescopeAgent.securityContext.readOnlyRootFilesystem: false
    asserts:
      - failedTemplate:
          errorMessage: "fusescopeAgent.securityContext must keep privileged and allowPrivilegeEscalation false, readOnlyRootFilesystem true, and drop ALL capabilities (collector-server ADR 0011)"

  - it: should share no host namespace
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeAgent.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.hostNetwork
          value: false
      - equal:
          path: spec.template.spec.hostPID
          value: false
      - equal:
          path: spec.template.spec.hostIPC
          value: false
      - notExists:
          path: spec.template.spec.containers[0].ports[0].hostPort

  - it: should mount every host path read-only except the checkpoint directory
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeAgent.enabled: true
    asserts:
      # Seven volumes, of which only these three are host paths.
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 7
      - contains:
          path: spec.template.spec.volumes
          content:
            name: pod-logs
            hostPath:
              path: /var/log/pods
              type: Directory
      - contains:
          path: spec.template.spec.volumes
          content:
            name: state
            hostPath:
              path: /var/lib/fusescope-agent
              type: DirectoryOrCreate
      - contains:
          path: spec.template.spec.volumes
          content:
            name: hostfs
            hostPath:
              path: /
              type: Directory
      - equal:
          path: spec.template.spec.containers[0].volumeMounts
          value:
            - name: config
              mountPath: /etc/fusescope-agent/config
              readOnly: true
            - name: tls
              mountPath: /etc/fusescope-agent/tls
              readOnly: true
            - name: gateway-ca
              mountPath: /etc/fusescope-agent/gateway-ca
              readOnly: true
            - name: token
              mountPath: /etc/fusescope-agent/token
              readOnly: true
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: state
              mountPath: /var/lib/fusescope-agent/state
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
              mountPropagation: HostToContainer

  - it: should mount no host path for kubelet stats alone
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeAgent.enabled: true
      fusescopeAgent.podLogs.enabled: false
      fusescopeAgent.hostMetrics.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.volumes[?(@.hostPath)]

  - it: should expose only its health port, on no host port
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeAgent.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - name: health
              containerPort: 13133
              protocol: TCP

  # Regression (kind smoke test, 2026-11-08): without hostNetwork the system
  # detector reports the pod's hostname, so host metrics carried the agent pod's
  # name as host.name and no k8s.node.name. The env detector runs first and wins.
  - it: should name the node, not the agent pod, on what it collects
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeAgent.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_RESOURCE_ATTRIBUTES
            value: host.name=$(K8S_NODE_NAME),k8s.node.name=$(K8S_NODE_NAME)
  - it: should detect env before system, so the node's name wins
    template: templates/fusescope-agent/configmap.yaml
    set:
      fusescopeAgent.enabled: true
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'detectors: \[env, system\]'
  # Regression (kind smoke test, 2026-11-08): without hostNetwork the network
  # scraper reads the pod's own network namespace, so it reported the agent
  # pod's traffic as the node's. Node traffic comes from kubelet stats instead.
  - it: should not scrape the pod's network as the node's
    template: templates/fusescope-agent/configmap.yaml
    set:
      fusescopeAgent.enabled: true
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'network: \{\}'

  # Review of #40 (2026-11-08): the non-root path could not read its credentials,
  # mounted 0440 and owned by root, without an fsGroup.
  - it: should give the non-root agent its group on mounted credentials
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeAgent.enabled: true
      fusescopeAgent.podSecurityContext.runAsUser: 10001
      fusescopeAgent.podSecurityContext.runAsGroup: 10002
      fusescopeAgent.podSecurityContext.runAsNonRoot: true
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 10002
  - it: should set no fsGroup for the root agent
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeAgent.enabled: true
    asserts:
      - notExists:
          path: spec.template.spec.securityContext.fsGroup

  # Review of #40: the guards checked only part of the effective context.
  - it: should refuse a pod seccomp profile other than RuntimeDefault
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeAgent.enabled: true
      fusescopeAgent.podSecurityContext.seccompProfile.type: Unconfined
    asserts:
      - failedTemplate:
          errorMessage: "fusescopeAgent.podSecurityContext.seccompProfile must be RuntimeDefault (collector-server ADR 0011)"
  - it: should refuse a container seccomp profile other than RuntimeDefault
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeAgent.enabled: true
      fusescopeAgent.securityContext.seccompProfile.type: Unconfined
    asserts:
      - failedTemplate:
          errorMessage: "fusescopeAgent.securityContext.seccompProfile, when set, must be RuntimeDefault (collector-server ADR 0011)"
  - it: should keep a container seccomp profile of RuntimeDefault
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeAgent.enabled: true
      fusescopeAgent.securityContext.seccompProfile.type: RuntimeDefault
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: RuntimeDefault
  - it: should refuse a user set on the container
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeAgent.enabled: true
      fusescopeAgent.podLogs.enabled: false
      fusescopeAgent.hostMetrics.enabled: false
      fusescopeAgent.securityContext.runAsUser: 0
    asserts:
      - failedTemplate:
          errorMessage: "fusescopeAgent.securityContext must not set runAsUser, runAsGroup or runAsNonRoot: the agent's user is fusescopeAgent.podSecurityContext's (collector-server ADR 0011)"
  - it: should refuse runAsNonRoot set on the container
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeAgent.enabled: true
      fusescopeAgent.securityContext.runAsNonRoot: false
    asserts:
      - failedTemplate:
          errorMessage: "fusescopeAgent.securityContext must not set runAsUser, runAsGroup or runAsNonRoot: the agent's user is fusescopeAgent.podSecurityContext's (collector-server ADR 0011)"
  - it: should refuse uid 0 for kubelet stats alone
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeAgent.enabled: true
      fusescopeAgent.podLogs.enabled: false
      fusescopeAgent.hostMetrics.enabled: false
      fusescopeAgent.podSecurityContext.runAsUser: 0
    asserts:
      - failedTemplate:
          errorMessage: "fusescopeAgent runs as root only with podLogs or hostMetrics: with kubelet stats alone, podSecurityContext must keep a non-zero runAsUser and runAsNonRoot true (collector-server ADR 0011)"
  - it: should refuse runAsNonRoot false for kubelet stats alone
    template: templates/fusescope-agent/daemonset.yaml
    set:
      fusescopeAgent.enabled: true
      fusescopeAgent.podLogs.enabled: false
      fusescopeAgent.hostMetrics.enabled: false
      fusescopeAgent.podSecurityContext.runAsNonRoot: false
    asserts:
      - failedTemplate:
          errorMessage: "fusescopeAgent runs as root only with podLogs or hostMetrics: with kubelet stats alone, podSecurityContext must keep a non-zero runAsUser and runAsNonRoot true (collector-server ADR 0011)"

  # Review of #40: agents in a namespace of their own were refused, and the
  # namespace label is automatic only from Kubernetes 1.22.
  - it: should admit the agents a values list names, for agents in another namespace
    template: templates/fusescope-collector/networkpolicy.yaml
    set:
      fusescopeCollector.agentListener.networkPolicy.ingressFrom:
        - namespaceSelector:
            matchLabels:
              fusescope.io/agents: "true"
          podSelector:
            matchLabels:
              app.kubernetes.io/component: fusescope-agent
    asserts:
      - equal:
          path: spec.ingress[0].from
          value:
            - namespaceSelector:
                matchLabels:
                  fusescope.io/agents: "true"
              podSelector:
                matchLabels:
                  app.kubernetes.io/component: fusescope-agent
