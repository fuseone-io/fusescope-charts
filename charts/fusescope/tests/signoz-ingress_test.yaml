suite: Test the FuseScope ingress

templates:
  - templates/signoz/ingress.yaml

release:
  name: fusescope
  namespace: platform

capabilities:
  majorVersion: 1
  minorVersion: 30
  apiVersions:
    - networking.k8s.io/v1

tests:
  - it: should route every path, /rum/ included, to the backend HTTP port by default
    set:
      signoz:
        ingress:
          enabled: true
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /
      - equal:
          path: spec.rules[0].http.paths[0].backend.service
          value:
            name: fusescope
            port:
              number: 8080
