# A development release: plain text and static query tokens, against an
# S3-compatible store over http.
image:
  repository: registry.example.com/fusescope-engine
  tag: "0.0.1"
secrets:
  ingester: fusescope-engine-ingester
  querier: fusescope-engine-querier
  compactor: fusescope-engine-compactor
  migrator: fusescope-engine-migrator
bucket:
  name: fusescope
  endpoint: http://minio:9000
  allowHttp: true
tls:
  enabled: false
auth:
  mode: token
ingester:
  replicas: 1
querier:
  replicas: 1
